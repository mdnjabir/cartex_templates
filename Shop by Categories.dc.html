<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>
  body { margin: 0; font-family: 'Manrope', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  a { color: #4338ca; }
  a:hover { color: #3730a3; }
  image-slot::part(ring) { display: none; }
</style>
</helmet>
<div style="background:#ffffff;padding:32px;max-width:1280px;margin:0 auto">
  <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:24px">
    <h2 style="font-size:22px;font-weight:800;color:#18181b;margin:0">Shop by Categories</h2>
    <a href="#" style="font-size:13px;font-weight:600;color:#4338ca;text-decoration:none;display:flex;align-items:center;gap:4px">
      View All Categories
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#4338ca" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </a>
  </div>
  <div style="display:flex;gap:32px;justify-content:space-between;flex-wrap:wrap">
    <sc-for list="{{ categories }}" as="c" hint-placeholder-count="6">
      <button onClick="{{ c.onClick }}" style="background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:12px;flex:1 1 100px;padding:0">
        <div style="width:132px;height:132px;border-radius:50%;background:{{ c.bg }};display:flex;align-items:center;justify-content:center;overflow:hidden">
          <image-slot id="{{ c.imgId }}" shape="circle" placeholder="Icon" src="{{ c.src }}" style="width:80%;height:80%"></image-slot>
        </div>
        <span style="font-size:14px;font-weight:600;color:#374151">{{ c.name }}</span>
      </button>
    </sc-for>
  </div>

  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:40px">
    <sc-for list="{{ featured }}" as="f" hint-placeholder-count="3">
      <div style="position:relative;border-radius:14px;overflow:hidden;background:{{ f.bg }};height:220px;padding:28px;display:flex;flex-direction:column;justify-content:space-between">
        <div>
          <h3 style="font-size:20px;font-weight:800;color:{{ f.textColor }};margin:0 0 8px;line-height:1.25;max-width:46%">{{ f.title }}</h3>
          <div style="font-size:13px;color:{{ f.subColor }};font-weight:500">{{ f.subtitle }}</div>
        </div>
        <a href="#" style="font-size:13px;font-weight:700;color:{{ f.textColor }};text-decoration:underline;text-decoration-color:{{ f.subColor }};text-underline-offset:3px">{{ f.cta }}</a>
        <image-slot id="{{ f.imgId }}" shape="rect" placeholder="Product image" src="{{ f.src }}" style="position:absolute;right:0;bottom:0;width:44%;height:100%;object-fit:contain"></image-slot>
      </div>
    </sc-for>
  </div>

  <div style="margin-top:64px">
    <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:24px">
      <h2 style="font-size:22px;font-weight:800;color:#18181b;margin:0">Shop by Categories — Square</h2>
      <a href="#" style="font-size:13px;font-weight:600;color:#4338ca;text-decoration:none;display:flex;align-items:center;gap:4px">
        View All Categories
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#4338ca" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </a>
    </div>
    <div style="display:flex;gap:32px;justify-content:space-between;flex-wrap:wrap">
      <sc-for list="{{ categories }}" as="c" hint-placeholder-count="6">
        <button onClick="{{ c.onClick }}" style="background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:12px;flex:1 1 100px;padding:0">
          <div style="width:132px;height:132px;border-radius:16px;background:{{ c.bg }};display:flex;align-items:center;justify-content:center;overflow:hidden">
            <image-slot id="sq-{{ c.imgId }}" shape="rect" placeholder="Icon" src="{{ c.src }}" style="width:80%;height:80%"></image-slot>
          </div>
          <span style="font-size:14px;font-weight:600;color:#374151">{{ c.name }}</span>
        </button>
      </sc-for>
    </div>
  </div>

  <div style="margin-top:64px">
    <h2 style="font-size:22px;font-weight:800;color:#18181b;margin:0 0 24px">Offer Banners — Two-Up</h2>
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:20px">
      <sc-for list="{{ twoUpFeatured }}" as="f" hint-placeholder-count="2">
        <div style="position:relative;border-radius:14px;overflow:hidden;background:{{ f.bg }};height:240px;padding:32px;display:flex;flex-direction:column;justify-content:space-between">
          <div>
            <h3 style="font-size:22px;font-weight:800;color:{{ f.textColor }};margin:0 0 8px;line-height:1.25;max-width:52%">{{ f.title }}</h3>
            <div style="font-size:13px;color:{{ f.subColor }};font-weight:500">{{ f.subtitle }}</div>
          </div>
          <a href="#" style="font-size:13px;font-weight:700;color:{{ f.textColor }};text-decoration:underline;text-decoration-color:{{ f.subColor }};text-underline-offset:3px">{{ f.cta }}</a>
          <image-slot id="tu-{{ f.imgId }}" shape="rect" placeholder="Product image" src="{{ f.src }}" style="position:absolute;right:0;bottom:0;width:38%;height:100%;object-fit:contain"></image-slot>
        </div>
      </sc-for>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  categoryList() {
    return [
      { key: 'electronics', name: 'Electronics', bg: '#dbeafe', src: 'uploads/pasted-1789446173567-0.png' },
      { key: 'fashion', name: 'Fashion', bg: '#fde2e2', src: 'uploads/pasted-1789446184027-0.png' },
      { key: 'home', name: 'Home & Kitchen', bg: '#fdf1d6', src: 'uploads/pasted-1789446189776-0.png' },
      { key: 'beauty', name: 'Beauty', bg: '#e6e0f7', src: 'uploads/pasted-1789446196424-0.png' },
      { key: 'sports', name: 'Sports', bg: '#dcf1e6', src: 'uploads/pasted-1789446208693-0.png' },
      { key: 'accessories', name: 'Accessories', bg: '#fbe3d4', src: 'uploads/pasted-1789446302919-0.png' },
    ];
  }

  featuredList() {
    return [
      { key: 'deals', title: 'New Deals at Best Prices', subtitle: 'From $40.00', cta: 'Browse Deals', bg: '#efd9c8', textColor: '#18181b', subColor: '#57534e', src: 'uploads/pasted-1789446173567-0.png' },
      { key: 'redmi', title: 'Colorful Redmi Note 6 Pro', subtitle: 'From $40.00', cta: 'Shop Cellphone', bg: '#a9c9e8', textColor: '#18181b', subColor: '#3f3f46', src: 'uploads/pasted-1789446184027-0.png' },
      { key: 'powerbank', title: '1000 mAh Power Bank', subtitle: 'From $40.00', cta: 'Shop Now', bg: '#18181b', textColor: '#ffffff', subColor: '#a1a1aa', src: 'uploads/pasted-1789446309984-0.png' },
    ];
  }

  renderVals() {
    const categories = this.categoryList().map(c => ({
      imgId: `cat-${c.key}`,
      name: c.name,
      bg: c.bg,
      src: c.src,
      onClick: () => {},
    }));
    const featured = this.featuredList().map(f => ({ ...f, imgId: `feat-${f.key}` }));
    const twoUpFeatured = this.featuredList().slice(0, 2).map(f => ({ ...f, imgId: `feat-${f.key}` }));
    return { categories, featured, twoUpFeatured };
  }
}

</script>
</body>
</html>
